name: build
on:
  push:
    branches: [main]
    paths-ignore: [deploy/**]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: artifact-publisher-main
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm test
  build-and-deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: BUILD_SHA=${{ github.sha }}
      - name: Pin the deploy manifest to this build
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('deploy/docker-compose.yml')
          text = path.read_text()
          path.write_text(re.sub(r'^    image: .*$', f"    image: {os.environ['IMAGE']}", text, flags=re.M))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/docker-compose.yml
          git commit -m "chore: deploy ${{ github.sha }}"
          git push origin HEAD:main
      - name: Trigger and verify deployment
        env:
          URL: ${{ vars.DEPLOY_RECEIVER_URL }}
          AUDIENCE: ${{ vars.DEPLOY_OIDC_AUDIENCE }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          token=$(curl --fail-with-body -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -er .value)
          curl --fail-with-body --retry 2 --connect-timeout 10 --max-time 30 -X POST -H "Authorization: Bearer $token" "$URL"
          version_url="${URL%/v1/deploy}/version"
          for _ in $(seq 1 60); do
            sha=$(curl -fsS --connect-timeout 5 --max-time 10 "$version_url" | jq -er .buildSha 2>/dev/null || true)
            [ "$sha" = "$EXPECTED_SHA" ] && exit 0
            sleep 5
          done
          echo "deployment did not report the expected build SHA" >&2
          exit 1
