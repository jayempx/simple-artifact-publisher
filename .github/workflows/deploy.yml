name: deploy
on:
  push:
    branches: [main]
    paths: [deploy/docker-compose.yml]
permissions:
  contents: read
  id-token: write
jobs:
  portainer-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Request a bound identity token
        id: oidc
        run: echo "token=$(curl --fail-with-body -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ vars.DEPLOY_OIDC_AUDIENCE }}" | jq -r .value)" >> "$GITHUB_OUTPUT"
      - name: Trigger the deployment receiver
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
          URL: ${{ vars.DEPLOY_RECEIVER_URL }}
        run: curl --fail-with-body --retry 2 --connect-timeout 10 --max-time 30 -X POST -H "Authorization: Bearer $TOKEN" "$URL"
